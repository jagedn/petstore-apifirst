openapi: 3.0.3
info:
  title: Petstore Lite API
  version: 1.0.0
  description: Contrato API-First para la gestión de mascotas.

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

tags:
  - name: pets
    description: Operaciones sobre el catálogo de mascotas

paths:
  /v1/pets:
    post:
      summary: Crear una nueva mascota
      operationId: createPet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Mascota creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Datos de entrada no válidos

  /v1/pets/{id}:
    get:
      summary: Obtener una mascota por su ID
      operationId: getPetById
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la mascota
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Mascota encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          description: Mascota no encontrada

    put:
      summary: Actualizar una mascota existente
      operationId: updatePet
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la mascota
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePetRequest'
      responses:
        '200':
          description: Mascota actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Datos de entrada no válidos
        '404':
          description: Mascota no encontrada

    delete:
      summary: Eliminar una mascota
      operationId: deletePet
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Mascota eliminada con éxito
        '404':
          description: Mascota no encontrada

components:
  schemas:
    PetStatus:
      type: string
      enum:
        - AVAILABLE
        - ADOPTED

    CreatePetRequest:
      type: object
      required:
        - name
        - age
      properties:
        name:
          type: string
          minLength: 2
          example: "Fido"
        age:
          type: integer
          format: int32
          minimum: 0
          example: 3
        status:
          $ref: '#/components/schemas/PetStatus'

    UpdatePetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: "Fido"
        age:
          type: integer
          format: int32
          minimum: 0
          example: 4
        status:
          $ref: '#/components/schemas/PetStatus'

    PetResponse:
      type: object
      required:
        - id
        - name
        - age
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Fido"
        age:
          type: integer
          format: int32
          example: 3
        status:
          $ref: '#/components/schemas/PetStatus'