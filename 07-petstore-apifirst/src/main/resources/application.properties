#Sun Aug 09 11:26:16 CEST 2026
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
#datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.schema-generate=CREATE_DROP
micronaut.application.name=petstore

micronaut.security.enabled=true

micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath\:META-INF/swagger/views/swagger-ui

micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath\:META-INF/swagger

micronaut.router.static-resources.openapi.enabled=true
micronaut.router.static-resources.openapi.mapping=/openapi/**
micronaut.router.static-resources.openapi.paths=classpath\:openapi

micronaut.security.intercept-url-map[0].pattern[0]=/swagger-ui/**
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern[0]=/swagger/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.security.intercept-url-map[2].pattern[0]=/openapi/petstore-api.yml
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()

micronaut.http.services.pokeapi.url=https://pokeapi.co