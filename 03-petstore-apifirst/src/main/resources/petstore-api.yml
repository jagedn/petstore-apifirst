openapi: 3.0.0
info:
  title: Petstore API
  version: 1.0.0
  description: |
    API 

servers:
  - url: http://localhost:8080/
    description: Servidor de pruebas

paths:
  /v1/pets:
    get:
      summary: Obtener un pet
      operationId: getPetById
      tags:
        - pets
      responses:
        '201':
          description: pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'

components:
  schemas:
    PetResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        age:
          type: integer
          format: int32