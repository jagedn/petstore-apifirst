openapi: 3.0.3
info:
  title: Petstore Lite API
  version: 1.0.0
  description: Contrato API-First simplificado para la gestión de mascotas.

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

tags:
  - name: pets
    description: Operaciones sobre el catálogo de mascotas

paths:
  /v1/pets:
    post:
      summary: Crear una nueva mascota
      operationId: createPet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Mascota creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          description: Datos de entrada no válidos

components:
  schemas:

    CreatePetRequest:
      type: object
      required:
        - name
        - age
      properties:
        name:
          type: string
          minLength: 2
          example: "Tiramisu"
        age:
          type: integer
          format: int32
          minimum: 0
          example: 3

    PetResponse:
      type: object
      required:
        - id
        - name
        - age

      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Tiramisu"
        age:
          type: integer
          format: int32
          example: 3
